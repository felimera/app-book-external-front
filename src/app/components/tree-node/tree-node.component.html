<mat-accordion>

  <mat-expansion-panel (opened)="panelOpenState.set(true)" (closed)="panelOpenState.set(false)">
    <mat-expansion-panel-header>
      <mat-panel-title> Specific search panel. </mat-panel-title>
      <mat-panel-description>
        Currently I am {{panelOpenState() ? 'open' : 'closed'}}
      </mat-panel-description>
    </mat-expansion-panel-header>

    <div>
      <form [formGroup]="formulario" (ngSubmit)="buscarDatos()" class="cuadricula">
        <mat-form-field appearance="outline" class="celda_izquierda">
          <mat-label>Field for the name of the book</mat-label>
          <input matInput placeholder="Placeholder" formControlName="nameBook">
        </mat-form-field>

        <mat-form-field appearance="outline" class="celda_centro">
          <mat-label>Field for the category name</mat-label>
          <input matInput placeholder="Placeholder" formControlName="nameCategory">
        </mat-form-field>

        <div class="celda_derecha centrado_arriba_abajo">
          <button mat-raised-button color="primary" type="submit">Buscar</button>
        </div>
      </form>
    </div>

  </mat-expansion-panel>

</mat-accordion>
<div class="box_tree">
  <mat-tree [dataSource]="dataSource" [treeControl]="treeControl">
    <!-- This is the tree node template for leaf nodes -->
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
      <!-- use a disabled button to provide padding for tree leaf -->
      <button mat-icon-button disabled></button>
      {{node.name}}
    </mat-tree-node>
    <!-- This is the tree node template for expandable nodes -->
    <mat-tree-node *matTreeNodeDef="let node;when: hasChild" matTreeNodePadding matTreeNodeToggle>
      <button mat-icon-button matTreeNodeToggle [attr.aria-label]="'Toggle ' + node.name">
        <mat-icon class="mat-icon-rtl-mirror">
          {{treeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
        </mat-icon>
      </button>
      {{node.name}}
    </mat-tree-node>
  </mat-tree>
</div>
