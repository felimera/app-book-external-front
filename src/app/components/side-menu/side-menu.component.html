<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav mode="side" opened="true">
    <mat-nav-list>
      <a mat-list-item routerLink="/home">
        <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home">home</mat-icon> Inicio
      </a>
      <a mat-list-item routerLink="/book">
        <mat-icon aria-hidden="false" aria-label="Example menu_book icon" fontIcon="menu_book">menu_book</mat-icon> Book
      </a>
      <a mat-list-item routerLink="/customer">
        <mat-icon aria-hidden="false" aria-label="Example person icon" fontIcon="person">person</mat-icon> Customer
      </a>
      <a mat-list-item routerLink="/schedule">
        <mat-icon aria-hidden="false" aria-label="Example pending_actions icon"
          fontIcon="pending_actions">pending_actions</mat-icon> Schedule
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <button mat-fab (click)="sidenav.toggle()">
        <mat-icon aria-hidden="false" aria-label="Example menu icon" fontIcon="menu">menu</mat-icon>
      </button>
      <span class="right_space left_space">Mi Aplicación</span>
    </mat-toolbar>
    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
