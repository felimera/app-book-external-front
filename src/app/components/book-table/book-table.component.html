<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->

  <!-- id Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> No. </th>
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <!-- idCliente Column -->
  <ng-container matColumnDef="idCliente">
    <th mat-header-cell *matHeaderCellDef> idCliente </th>
    <td mat-cell *matCellDef="let element"> {{element.idCliente}} </td>
  </ng-container>

  <!-- titulo Column -->
  <ng-container matColumnDef="titulo">
    <th mat-header-cell *matHeaderCellDef> titulo </th>
    <td mat-cell *matCellDef="let element"> {{element.titulo}} </td>
  </ng-container>

  <!-- completo Column -->
  <ng-container matColumnDef="completo">
    <th mat-header-cell *matHeaderCellDef> completo </th>
    <td mat-cell *matCellDef="let element"> {{element.completo}} </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
